name: JS Checks

on:
  push:
  pull_request:

jobs:
  js-checks:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install safe-chain v1.5.7 (SHA-verified)
        run: |
          curl -fsSL -o /tmp/install-safe-chain.sh \
            https://github.com/AikidoSec/safe-chain/releases/download/1.5.7/install-safe-chain.sh
          echo "07ab512fd8795ce41b2275be369aced4c9a93cc7bca9b397951507891a955239  /tmp/install-safe-chain.sh" \
            | sha256sum --check --status
          sh /tmp/install-safe-chain.sh --ci

      - name: Install dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

      - name: Dependency vulnerability check
        run: npm audit --audit-level=high
        continue-on-error: true  # report only; build-tool vulns (fast-xml-parser) are dev-only

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test -- --ci --coverage=false
