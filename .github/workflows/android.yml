name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android-build:
    name: Gradle assembleRelease
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache node_modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install safe-chain v1.5.7 (SHA-verified)
        run: |
          curl -fsSL -o /tmp/install-safe-chain.sh \
            https://github.com/AikidoSec/safe-chain/releases/download/1.5.7/install-safe-chain.sh
          echo "07ab512fd8795ce41b2275be369aced4c9a93cc7bca9b397951507891a955239  /tmp/install-safe-chain.sh" \
            | sha256sum --check --status
          sh /tmp/install-safe-chain.sh --ci

      - name: Install JS dependencies
        run: npm ci --safe-chain-skip-minimum-package-age

      # ── Release signing ──────────────────────────────────────────────────────
      # Decode the base64-encoded keystore from GitHub Secrets and write the
      # properties file that build.gradle reads.  If secrets are not set (e.g.
      # on a fork PR), the build falls back to the debug keystore automatically.
      - name: Configure release signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/noring-release.keystore
          cat > android/keystore.properties << EOF
          storeFile=noring-release.keystore
          storePassword=$KEYSTORE_STORE_PASSWORD
          keyAlias=$KEYSTORE_KEY_ALIAS
          keyPassword=$KEYSTORE_KEY_PASSWORD
          EOF

      - name: Build APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          cd android
          if [ -f keystore.properties ]; then
            ./gradlew assembleRelease --no-daemon
          else
            echo "No release keystore configured — building debug APK"
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Clean up keystore
        if: always()
        run: |
          rm -f android/app/noring-release.keystore android/keystore.properties
